config_version: "2.8"
show_notifications_when: never
style:
  color_scheme: light
  color_scheme_dark: dark
  candidate_list_layout: linear
  candidate_format: " [label] [candidate] [comment]"
  inline_preedit: true
  inline_candidate: false
  font_face: "PingFang SC"
  font_point: 16
  label_font_point: 12
  comment_font_point: 12
  panel_padding: 3.5
  corner_radius: 8
  hilited_corner_radius: 6
  line_spacing: 0
  border_width: 0
  border_height: 0
